@if (isOpenMobile()) {
  <div class="fixed inset-0 z-40 bg-black/50 md:hidden backdrop-blur-sm transition-opacity" (click)="onBackdropClick()"></div>
}

<aside 
  class="fixed top-0 start-0 z-50 h-screen transition-all duration-300 ease-in-out bg-slate-900 dark:bg-slate-950 text-white flex flex-col md:translate-x-0 w-64"
  [class.translate-x-0]="isOpenMobile()"
  [class.-translate-x-full]="!isOpenMobile()"
  [class.md:w-20]="collapsed()">
  
  <div class="h-16 flex items-center px-4 border-b border-slate-800 overflow-hidden shrink-0">
    <lucide-icon name="ticket" class="w-8 h-8 text-indigo-500 shrink-0"></lucide-icon>
    <span class="ms-3 text-xl font-bold whitespace-nowrap" 
          [class.md:hidden]="collapsed()">
      TicketHub
    </span>
  </div>

  <nav class="flex-1 overflow-y-auto py-4 flex flex-col gap-2 px-2">
    @for (item of navItems(); track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="bg-indigo-600/20 border-indigo-500 text-indigo-400"
         [routerLinkActiveOptions]="{exact: false}"
         class="flex items-center px-2 py-3 rounded-md transition-colors border-s-4 border-transparent hover:bg-slate-800 text-slate-300 hover:text-white"
         (click)="onItemClick()"
         title="{{ item.label }}">
        <lucide-icon [name]="item.icon" class="w-5 h-5 shrink-0"></lucide-icon>
        <span class="ms-3 whitespace-nowrap" 
              [class.md:hidden]="collapsed()">
          {{ item.label }}
        </span>
      </a>
    }
  </nav>

  <div class="p-2 border-t border-slate-800 shrink-0">
    <button (click)="logout()"
            class="w-full flex items-center px-2 py-3 rounded-md transition-colors hover:bg-slate-800 text-slate-400 hover:text-white"
            title="Log out">
      <lucide-icon name="log-out" class="w-5 h-5 shrink-0"></lucide-icon>
      <span class="ms-3 whitespace-nowrap" 
            [class.md:hidden]="collapsed()">
        Log out
      </span>
    </button>
  </div>
</aside>
