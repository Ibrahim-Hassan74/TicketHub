<div class="flex min-h-screen bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
  <app-sidebar 
    [collapsed]="sidebarCollapsed" 
    [isOpenMobile]="mobileSidebarOpen"
    (closeMobile)="mobileSidebarOpen = false"
  ></app-sidebar>

  <div 
    class="flex flex-col flex-1 transition-all duration-300 w-full"
    [class.md:ms-64]="!sidebarCollapsed"
    [class.md:ms-20]="sidebarCollapsed"
  >
    <app-topbar
      (openMobileMenu)="mobileSidebarOpen = true"
      (toggleCollapse)="toggleSidebar()"
    ></app-topbar>
    
    <main class="flex-1 p-4 sm:p-6 lg:p-8 overflow-x-hidden">
      <div class="mx-auto max-w-7xl">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
