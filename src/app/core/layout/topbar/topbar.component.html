<header class="h-16 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between px-4 lg:px-6 z-30 sticky top-0 transition-colors">
  <div class="flex items-center gap-2">
    <button (click)="onOpenMobileMenu()" class="p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 md:hidden focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
      <lucide-icon name="menu" class="w-6 h-6"></lucide-icon>
    </button>
    <button (click)="onToggleCollapse()" class="hidden md:block p-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors">
      <lucide-icon name="menu" class="w-6 h-6"></lucide-icon>
    </button>
  </div>

  <div class="flex items-center relative">
    <button (click)="toggleDropdown()" (blur)="closeDropdown()" class="flex items-center gap-3 focus:outline-none group rounded-full py-1.5 px-1.5 pe-3 hover:bg-slate-50 dark:hover:bg-slate-800/80 transition-all border border-transparent hover:border-slate-200 dark:hover:border-slate-700">
      <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center font-bold shadow-sm shadow-indigo-500/30 border border-white/20">
        {{ userInitials() }}
      </div>
      <div class="hidden sm:flex flex-col items-start">
        <span class="text-sm font-semibold text-slate-700 dark:text-slate-200 group-hover:text-slate-900 dark:group-hover:text-white leading-none tracking-tight">
          {{ currentUser()?.displayName }}
        </span>
        <span class="text-[11px] font-medium text-slate-500 dark:text-slate-400 mt-1 flex items-center gap-1.5 uppercase tracking-wider">
          <div class="w-1.5 h-1.5 rounded-full" [ngClass]="roleIndicatorClass()"></div>
          {{ currentUser()?.role }}
        </span>
      </div>
      <lucide-icon name="chevron-down" class="w-4 h-4 text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300 ms-1 transition-transform group-focus:-rotate-180"></lucide-icon>
    </button>

    @if (isDropdownOpen) {
      <div class="absolute end-0 top-full mt-1 w-48 bg-white dark:bg-slate-900 rounded-md shadow-lg py-1 border border-slate-200 dark:border-slate-800 z-50">
        <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-800 sm:hidden">
          <p class="text-sm font-medium text-slate-900 dark:text-white truncate">{{ currentUser()?.displayName }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ currentUser()?.email }}</p>
        </div>
        <button class="w-full text-start px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2 transition-colors">
          <lucide-icon name="user" class="w-4 h-4"></lucide-icon>
          Profile
        </button>
        <button class="w-full text-start px-4 py-2 text-sm text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2 transition-colors">
          <lucide-icon name="settings" class="w-4 h-4"></lucide-icon>
          Settings
        </button>
        <div class="h-px bg-slate-100 dark:bg-slate-800 my-1"></div>
        <button (mousedown)="logout()" class="w-full text-start px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-2 transition-colors">
          <lucide-icon name="log-out" class="w-4 h-4"></lucide-icon>
          Log out
        </button>
      </div>
    }
  </div>
</header>
