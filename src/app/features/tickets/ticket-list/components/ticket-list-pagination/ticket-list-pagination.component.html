@if (totalPages() > 1 && !isLoading()) {
<div class="mt-8 flex flex-col sm:flex-row sm:items-center sm:justify-between animate-fade-in-up animate-stagger-3">
  <div class="text-sm text-gray-500 dark:text-gray-400 text-center sm:text-left mb-4 sm:mb-0">
    Showing page <span class="font-bold text-gray-900 dark:text-white">{{ query().page }}</span> of <span
      class="font-bold text-gray-900 dark:text-white">{{ totalPages() }}</span>
    <span class="mx-2 text-gray-300 dark:text-gray-700">|</span>
    Total Records: <span class="font-semibold">{{ totalCount() }}</span>
  </div>
  <nav role="navigation" aria-label="Pagination">
    <ul class="flex justify-center gap-2">
      <li>
        <button
          class="btn flex items-center gap-1.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:border-blue-300 dark:hover:border-blue-700 rounded-xl px-4 py-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-all"
          [disabled]="query().page === 1" (click)="onPageChange((query().page || 1) - 1)">
          <lucide-icon name="chevron-left" class="w-4 h-4"></lucide-icon> Prev
        </button>
      </li>
      <li>
        <button
          class="btn flex items-center gap-1.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 hover:border-blue-300 dark:hover:border-blue-700 rounded-xl px-4 py-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-all"
          [disabled]="query().page === totalPages()" (click)="onPageChange((query().page || 1) + 1)">
          Next <lucide-icon name="chevron-right" class="w-4 h-4"></lucide-icon>
        </button>
      </li>
    </ul>
  </nav>
</div>
}
