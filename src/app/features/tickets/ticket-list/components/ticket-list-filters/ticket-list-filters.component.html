<!-- Filters -->
<div class="glass-card rounded-2xl mb-8 p-5 lg:p-6 relative z-10">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div>
      <label
        class="block text-xs font-semibold uppercase tracking-wider mb-2 text-gray-500 dark:text-gray-400">Search</label>
      <div class="relative group">
        <lucide-icon name="search"
          class="w-5 h-5 absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-blue-500 transition-colors"></lucide-icon>
        <input type="text" class="premium-input pl-10" placeholder="Search tickets by title..."
          [ngModel]="query().search" (ngModelChange)="onSearchChange($event)">
      </div>
    </div>
    <div>
      <label
        class="block text-xs font-semibold uppercase tracking-wider mb-2 text-gray-500 dark:text-gray-400">Status</label>
      <select class="premium-input appearance-none bg-no-repeat"
        style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239CA3AF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-position: right 1rem top 50%; background-size: 0.65rem auto;"
        [ngModel]="query().status || ''" (ngModelChange)="onFilterChange('status', $event)">
        @for (opt of statusOptions(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>
    <div>
      <label
        class="block text-xs font-semibold uppercase tracking-wider mb-2 text-gray-500 dark:text-gray-400">Priority</label>
      <select class="premium-input appearance-none bg-no-repeat"
        style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239CA3AF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-position: right 1rem top 50%; background-size: 0.65rem auto;"
        [ngModel]="query().priority || ''" (ngModelChange)="onFilterChange('priority', $event)">
        @for (opt of priorityOptions(); track opt.value) {
        <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
      <div class="mt-6 flex justify-end">
        <button (click)="resetFilters.emit()" class="text-sm text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors flex items-center gap-1 font-medium">
          <lucide-icon name="rotate-ccw" class="w-4 h-4"></lucide-icon>
          Reset Filters
        </button>
      </div>
    </div>
  </div>
</div>
