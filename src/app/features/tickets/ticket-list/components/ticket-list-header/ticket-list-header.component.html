<!-- Page header -->
<div class="sm:flex sm:justify-between sm:items-center mb-8 relative z-10">
  <div class="mb-4 sm:mb-0">
    <h1 class="text-3xl md:text-4xl text-gray-900 dark:text-white font-extrabold tracking-tight">Tickets</h1>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">Manage and track all support requests seamlessly.</p>
  </div>
  <div class="grid grid-flow-col sm:auto-cols-max justify-start sm:justify-end gap-3">
    @if (currentUser()?.role === 'Customer') {
    <button routerLink="/tickets/new"
      class="btn bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl px-5 py-2.5 flex items-center gap-2 shadow-lg shadow-blue-500/30 transition-all duration-300 transform hover:-translate-y-0.5">
      <lucide-icon name="plus" class="w-4 h-4"></lucide-icon>
      <span class="font-semibold">New Ticket</span>
    </button>
    }
  </div>
</div>
