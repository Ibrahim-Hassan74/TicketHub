<div class="glass-card rounded-2xl overflow-hidden flex flex-col h-[450px]">
  <div class="p-6 border-b border-gray-100 dark:border-gray-800/60 bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm flex items-center justify-between">
    <h2 class="text-lg font-bold text-gray-900 dark:text-white flex items-center gap-2">
      <lucide-icon name="trending-up" class="w-5 h-5 text-blue-500"></lucide-icon>
      Ticket Volume
    </h2>
    <select 
      class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
      (change)="onDaysChange($event)"
      [value]="selectedDays()"
      [disabled]="isLoading()">
      <option value="7">Last 7 Days</option>
      <option value="30">Last 30 Days</option>
      <option value="90">Last 90 Days</option>
    </select>
  </div>
  <div class="p-4 flex-1 w-full overflow-hidden relative">
    @if (isLoading()) {
      <div class="absolute inset-0 bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm flex items-center justify-center z-10">
        <lucide-icon name="loader-2" class="w-8 h-8 animate-spin text-blue-500"></lucide-icon>
      </div>
    }
    @if (trends().length > 0) {
      <div #chartElement class="w-full h-full min-h-[300px]"></div>
    } @else {
      <div class="h-full flex flex-col items-center justify-center text-gray-400 p-6 text-center">
        <lucide-icon name="bar-chart-2" class="w-10 h-10 mb-3 opacity-30"></lucide-icon>
        <p class="text-sm font-medium">No trend data available</p>
      </div>
    }
  </div>
</div>
