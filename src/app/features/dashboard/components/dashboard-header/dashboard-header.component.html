<div class="flex items-center justify-between mb-8">
  <div>
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Dashboard overview</h1>
    <p class="text-gray-500 dark:text-gray-400">System metrics and agent performance</p>
  </div>
  <div class="flex items-center gap-2">
    <button (click)="onRefresh()" class="btn bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg px-4 py-2 flex items-center gap-2 transition-colors shadow-sm">
      <lucide-icon name="refresh-cw" class="w-4 h-4" [class.animate-spin]="isLoading()"></lucide-icon>
      Refresh
    </button>
  </div>
</div>
