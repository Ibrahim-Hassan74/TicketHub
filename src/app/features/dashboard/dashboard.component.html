<div class="space-y-6 animate-fade-in-up">
  <app-dashboard-header 
    [isLoading]="isLoading()" 
    (refresh)="loadDashboardData()" />

  @if (isLoading()) {
    <div class="flex flex-col items-center justify-center py-20">
      <lucide-icon name="loader-2" class="w-12 h-12 animate-spin text-blue-500 mb-4"></lucide-icon>
      <p class="text-gray-500 font-medium">Crunching the latest data...</p>
    </div>
  } @else {
    @if (stats(); as s) {
      <app-dashboard-stats [stats]="s" />
    }

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <app-dashboard-workload 
        [workload]="agentWorkload()" 
        class="lg:col-span-1" />
        
      <app-dashboard-trends 
        [trends]="ticketTrends()"
        [isLoading]="isLoadingTrends()"
        [selectedDays]="selectedDays()"
        (daysChange)="loadTrends($event)"
        class="lg:col-span-2" />
    </div>
  }
</div>
